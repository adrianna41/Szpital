<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../css/style.css">
    <link rel="icon" href="../img/hospital_favicon.ico"/>
    <title>Szpital - logowanie</title>
</head>
<body class="logowanie-rejestracja">
    <header>
        <nav>
            <a href="../index.html">Strona główna</a>
            <a href="kontakt.html">Kontakt</a>
            <a href="#">Rejestracja</a>
            <a href="logowanie.html">Logowanie</a>
        </nav>
    </header>

    <div class="logowanie-container">
        <div class="logowanie-text-box">
            <h1>Zarejestruj się</h1>
            <form>
                <label for="name-rejestracja">Imię</label>
                <input type="text" name="name" placeholder="Wprowadź imię" id="name-rejestracja" required>
                <label for="surname-rejestracja">Nazwisko</label>
                <input type="text" name="surname" placeholder="Wprowadź nazwisko" id="surname-rejestracja" required>
                <label for="pesel-rejestracja">PESEL</label>
                <input type="number" name="pesel" placeholder="Wprowadź numer PESEL" id="pesel-rejestracja" required>
                <label for="email-logowanie">Email</label>
                <input type="email" name="email" placeholder="Wprowadź adres email" id="email-logowanie" required>
                <label for="haslo-logowanie">Hasło</label>
                <input type="password" name="password" placeholder="Wprowadź hasło" id="haslo-logowanie">
                <label for="powtorzone-haslo-logowanie">Powtórzone hasło</label>
                <input type="password" name="repeated-password" placeholder="Wprowadź powtórzone hasło" id="powtorzone-haslo-logowanie">
                <a class="button" href="lista_ogloszen.html">Zarejestruj się</a>
            </form>
        </div>
    </div>
        
    </div>
</body>
</html>
